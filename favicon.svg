<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark premium background -->
  <rect width="100" height="100" rx="25" fill="#121212" />
  <!-- Elegant gold border -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="none" stroke="#D4AF37" stroke-width="2" />
  <!-- Monogram HR -->
  <text x="50" y="64" font-family="'Playfair Display', 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#D4AF37" text-anchor="middle" letter-spacing="1">HR</text>
  <!-- Decorative diamond point -->
  <polygon points="50,15 54,21 50,27 46,21" fill="#D4AF37" />
  <polygon points="50,73 54,79 50,85 46,79" fill="#D4AF37" />
</svg>
